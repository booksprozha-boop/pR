<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg1:#05070a; --bg2:#2a3142;
  --glass:rgba(255,255,255,.13); --glass-2:rgba(255,255,255,.2);
  --gborder:rgba(255,255,255,.26); --gborder-2:rgba(255,255,255,.38);
  --txt:#fff; --txt2:rgba(255,255,255,.65); --txt3:rgba(255,255,255,.45);
  --blue:#1877f2; --purple:#0d5dc9; --gold:#eaf5ff;
  --acc1:rgba(24,119,242,.28); --acc2:rgba(13,93,201,.24);
}
html[data-theme="light"]{
  --bg1:#dfe4ec; --bg2:#fbfcfe;
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.93);
  --gborder:rgba(100,106,122,.16); --gborder-2:rgba(100,106,122,.28);
  --txt:#20232b; --txt2:rgba(32,35,43,.62); --txt3:rgba(32,35,43,.42);
  --acc1:rgba(24,119,242,.12); --acc2:rgba(13,93,201,.1);
}
*{box-sizing:border-box}
html{transition:background .25s}
body{margin:0;min-height:100vh;background:
    radial-gradient(900px 500px at 15% -10%, var(--acc1), transparent 60%),
    radial-gradient(800px 500px at 110% 10%, var(--acc2), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  color:var(--txt);font-family:'Vazirmatn',-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.8;transition:color .2s}
h1,h2,h3,.logo,.title,.row-title,.name{font-weight:800}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--blue),var(--purple));border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--purple),var(--blue));background-clip:padding-box}
*{scrollbar-color:var(--blue) transparent}
.orb{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;opacity:.55;mix-blend-mode:plus-lighter}
html[data-theme="light"] .orb{opacity:.3;mix-blend-mode:normal}
.orb1{width:420px;height:420px;top:-120px;right:-100px;background:radial-gradient(circle,var(--blue),transparent 70%);animation:orbFloat1 22s ease-in-out infinite}
.orb2{width:360px;height:360px;bottom:-140px;left:-80px;background:radial-gradient(circle,var(--purple),transparent 70%);animation:orbFloat2 26s ease-in-out infinite}
.orb3{width:260px;height:260px;top:45%;left:60%;background:radial-gradient(circle,var(--gold),transparent 70%);opacity:.22;animation:orbFloat3 30s ease-in-out infinite}
html[data-theme="light"] .orb3{opacity:.14}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,50px) scale(1.12)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.08)}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-30px) scale(1.18)}}
.wrap{position:relative;z-index:1}
.theme-btn{position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -6px 10px -6px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--txt);flex-shrink:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease}
.theme-btn::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.65),transparent 55%);opacity:.8;pointer-events:none}
.theme-btn:hover{transform:scale(1.14) rotate(14deg);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -6px 10px -6px rgba(0,0,0,.12),0 8px 22px rgba(24,119,242,.3)}
.theme-btn:active{transform:scale(.94)}
.glass{position:relative;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.35)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 45%);pointer-events:none}
.wrap{max-width:1040px;margin:0 auto;padding:18px 20px 60px}
a{color:inherit;text-decoration:none}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.logo .mark{position:relative;overflow:hidden;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple) 60%,var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(24,119,242,.35);display:flex;align-items:center;justify-content:center;color:#0a0a0a;font-size:16px;flex-shrink:0}
.logo .mark::after{content:'';position:absolute;top:-50%;left:-150%;width:60%;height:200%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:markShine 4.5s ease-in-out infinite}
@keyframes markShine{0%,55%{left:-150%}100%{left:200%}}
.logo-text{background:linear-gradient(135deg,var(--blue),var(--gold) 70%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--txt2);padding:7px 14px;border-radius:10px;white-space:nowrap;transition:background .15s,color .15s}
.nav a.active{backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);color:var(--txt)}
.ticker-wrap{display:flex;align-items:center;gap:10px;overflow:hidden;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);background:linear-gradient(160deg,rgba(255,185,90,.22),rgba(255,185,90,.08));border:1px solid rgba(255,185,90,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px rgba(255,160,70,.12);border-radius:12px;padding:6px 14px 6px 6px;margin-bottom:16px;color:#ffdca8;font-size:12.5px}
html[data-theme="light"] .ticker-wrap{color:#7a4a08;background:linear-gradient(160deg,rgba(255,185,90,.3),rgba(255,185,90,.12))}
.ticker-wrap:empty{display:none}
.ticker-badge{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:4px;width:30px;height:30px;background:linear-gradient(135deg,#ffb95a,#ff8c3c);color:#1b1206;font-size:14px;border-radius:50%;box-shadow:0 2px 8px rgba(255,160,70,.45)}
.ticker-badge .dot{width:6px;height:6px;border-radius:50%;background:#1b1206;animation:tickerPulse 1.4s ease-in-out infinite}
@keyframes tickerPulse{0%,100%{opacity:1}50%{opacity:.25}}
.ticker-viewport{position:relative;flex:1;min-width:0;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker-track{display:inline-flex;gap:60px;animation:tick 26s linear infinite;will-change:transform}
.ticker-track span{display:inline-block}
.ticker-wrap:hover .ticker-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.3);border-radius:12px;padding:10px 6px;text-align:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease}
.stat:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 26px rgba(24,119,242,.2)}
.stat::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 50%);pointer-events:none}
.stat b{position:relative;display:block;font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.stat span{position:relative;font-size:10.5px;color:var(--txt2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat-filter .sort-sel{width:100%;max-width:260px}
.chip{position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -8px 12px -8px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.08);color:var(--txt2);font-size:12px;font-weight:600;padding:9px 18px;border-radius:13px;cursor:pointer;white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,color .15s}
.chip::before{content:'';position:absolute;top:0;left:10%;right:10%;height:45%;border-radius:50px;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);opacity:.8;pointer-events:none}
.chip::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 55%);opacity:.5;pointer-events:none}
.chip:hover{transform:translateY(-3px) scale(1.03);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 12px -8px rgba(0,0,0,.1),0 12px 26px rgba(24,119,242,.22);color:var(--txt)}
.chip:active{transform:translateY(-1px) scale(.98)}
.chip.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -8px 12px -8px rgba(0,0,0,.2),0 10px 24px rgba(24,119,242,.45)}
.searchrow{display:flex;gap:8px;align-items:flex-start}
.searchrow .search{flex:1}
.sort-sel{flex-shrink:0;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:12px;outline:none;margin-bottom:16px;cursor:pointer;transition:border-color .2s}
.sort-sel:focus{border-color:var(--gborder-2)}
.meta-date{margin-right:auto;color:var(--txt3)}
.search{position:relative}
.search-ic{position:absolute;top:50%;right:14px;transform:translateY(-50%);font-size:13px;opacity:.55;pointer-events:none}
html[dir="rtl"] .search-ic{right:14px}
.search input{width:100%;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-radius:10px;padding:10px 38px 10px 14px;color:var(--txt);font-size:13px;outline:none;margin-bottom:16px;transition:box-shadow .3s ease,border-color .3s ease}
.search input:focus{border-color:var(--gborder-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 3px var(--acc1),0 8px 20px rgba(24,119,242,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{position:relative;overflow:hidden;backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.25);border-radius:16px;padding:10px;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.2,.4,1),box-shadow .3s ease;animation:cardIn .5s cubic-bezier(.22,1,.36,1) backwards}
.card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.14s}.card:nth-child(5){animation-delay:.18s}.card:nth-child(6){animation-delay:.22s}.card:nth-child(7){animation-delay:.26s}.card:nth-child(8){animation-delay:.3s}.card:nth-child(n+9){animation-delay:.34s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 50%);pointer-events:none}
.card:hover{transform:translateY(-5px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 18px 38px rgba(24,119,242,.18),0 6px 16px rgba(0,0,0,.25)}
.card:active{transform:translateY(-2px)}
.cover{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);height:150px;border-radius:10px;margin-bottom:9px;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:24px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.badge{position:absolute;top:7px;right:7px;backdrop-filter:blur(10px);background:linear-gradient(135deg,rgba(24,119,242,.95),rgba(13,93,201,.9));border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.3);color:#fff;font-size:9.5px;padding:3px 8px;border-radius:6px}
.fav-heart{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;backdrop-filter:blur(12px) saturate(180%);background:rgba(10,12,18,.5);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;cursor:pointer;z-index:2;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s}
.fav-heart:hover{transform:scale(1.18)}
.fav-heart:active{transform:scale(.92)}
.fav-heart.on{color:#ff6b8a;background:rgba(255,107,138,.22);border-color:rgba(255,107,138,.5);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 3px 12px rgba(255,107,138,.35)}
.fav-heart.pulse{animation:favPulse .35s ease}
.share-btn{position:absolute;bottom:6px;left:6px;width:26px;height:26px;border-radius:50%;backdrop-filter:blur(12px) saturate(180%);background:rgba(10,12,18,.5);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:2;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .2s}
.share-btn:hover{transform:scale(1.18);color:var(--blue)}
.share-btn:active{transform:scale(.92)}
.share-btn.row-share{position:static;flex-shrink:0}
@keyframes favPulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
#favToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px rgba(0,0,0,.35);border-radius:12px;padding:10px 18px;font-size:12.5px;color:var(--txt);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#favToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.card .title{font-weight:600;font-size:12px;line-height:1.4;margin:0 0 2px}
.card .author{font-size:10.5px;color:var(--txt2);margin:0 0 6px}
.meta-row{display:flex;gap:10px;font-size:10.5px;color:var(--txt3)}
.added-by{font-size:9px;color:var(--txt3);opacity:.75;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.card-pdf-row{display:flex;gap:5px;margin-top:7px}
.pdf-mini{position:relative;overflow:hidden;flex:1;backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);color:var(--txt);font-size:9.5px;font-weight:700;padding:5px 4px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,color .15s}
.pdf-mini:hover{transform:translateY(-2px);color:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 16px rgba(24,119,242,.2)}
.pdf-mini:active{transform:translateY(0) scale(.96)}
.modal .added-by{margin:-4px 0 12px;font-size:10.5px}
.empty{color:var(--txt2);font-size:13px;padding:30px 0;text-align:center}
h2.section{font-size:18px;font-weight:800;margin:0 0 16px;letter-spacing:.2px}
.list{display:flex;flex-direction:column;gap:12px}
.row-card{position:relative;overflow:hidden;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.3);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.row-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 50%);pointer-events:none}
.row-card:hover{transform:translateY(-3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 16px 32px rgba(24,119,242,.16),0 6px 16px rgba(0,0,0,.22)}
.row-card:active{transform:translateY(-1px)}
.icon-box{position:relative;overflow:hidden;width:52px;height:52px;border-radius:10px;background:linear-gradient(160deg,rgba(24,119,242,.32),rgba(24,119,242,.14));border:1px solid rgba(139,176,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#bcd0ff;flex-shrink:0;font-size:20px}
.icon-box img{width:100%;height:100%;object-fit:cover}
.row-card.done{opacity:.55}
.date-box{position:relative;width:56px;height:56px;border-radius:10px;background:linear-gradient(160deg,rgba(255,185,90,.3),rgba(255,185,90,.12));border:1px solid rgba(255,207,138,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.date-box b{font-size:16px;font-weight:600}
.date-box span{font-size:10px}
.row-title{font-weight:800;font-size:15px;margin:0 0 3px}
.row-meta{font-size:12px;color:var(--txt2);margin:0}
.about-card{position:relative;overflow:hidden;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 26px rgba(0,0,0,.3);border-radius:14px;padding:18px;margin-bottom:18px}
.about-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 50%);pointer-events:none}
.about-card h3{position:relative;font-size:17px;font-weight:800;margin:0 0 8px}
.about-card p{position:relative;font-size:13px;color:var(--txt2)}

<script>
const SUPABASE_URL = 'https://viynxaoruqktjgakgygv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CAGeHeQS8MLUAur6pKCXcg_ilMREtnL';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let DATA = { cats: [], books: [], posts: [], admins: [], settings: null, messages: [] };
let activeCat = null;
let activeSort = 'new';

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = t==='light' ? '☀️' : '🌙';
  try{ localStorage.setItem('theme', t); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('theme'); }catch(e){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
})();
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('themeBtn');
  if(btn){
    btn.textContent = document.documentElement.getAttribute('data-theme')==='light' ? '☀️' : '🌙';
    btn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');

});

// Lights up a dot (out of a fixed small row) matching how far the
// horizontally scrollable mobile nav has been scrolled — like a photo
// carousel's page dots — so it's visually obvious there's more to see.
function initNavDots(){
  const nav = document.getElementById('nav');
  const dotsEl = document.getElementById('navDots');
  if (!nav || !dotsEl) return;
  const dots = Array.from(dotsEl.querySelectorAll('.dot'));
  if (!dots.length) return;
  function update(){
    const max = nav.scrollWidth - nav.clientWidth;
    if (max <= 1){ dotsEl.style.display = 'none'; return; }
    dotsEl.style.display = '';
    const progress = Math.min(1, Math.abs(nav.scrollLeft) / max);
    const idx = Math.round(progress * (dots.length - 1));
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  }
  nav.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
  setTimeout(update, 300);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const EYE_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;display:inline-block"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
const FB_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="color:#1877F2"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.84c0-2.51 1.49-3.9 3.78-3.9 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>';
const IG_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="#c084fc" stroke="none"/></svg>';
const YT_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff6b6b"/><path d="M10.5 9.5l5 2.5-5 2.5z" fill="#fff"/></svg>';
const SHARE_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>';
function favKey(){ return 'book_favs'; }
function getFavs(){ try{ return JSON.parse(localStorage.getItem(favKey())||'[]'); }catch(e){ return []; } }
function toggleFav(id){
  let f = getFavs();
  id = String(id);
  if (f.includes(id)) f = f.filter(x => x !== id); else f.push(id);
  try{ localStorage.setItem(favKey(), JSON.stringify(f)); }catch(e){}
}
function seenKey(kind,id){ return 'seen_' + kind + '_' + id; }
function bumpViewOnce(kind, id){
  const k = seenKey(kind, id);
  try{ if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
  const fn = kind === 'book' ? 'bump_book_views' : 'bump_post_views';
  sb.rpc(fn, { p_id: id }).then(()=>{});
}
function fmtDate(d){
  if(!d) return '';
  return new Date(d).toLocaleDateString('en-GB');
}

async function loadAll(){
  const results = await Promise.all([
    sb.from('categories').select('*').order('id'),
    sb.from('books').select('*, admin_profiles(name)').order('created_at',{ascending:false}),
    sb.from('posts').select('*, admin_profiles(name)').order('created_at',{ascending:false}),
    sb.from('admin_profiles').select('*').order('created_at'),
    sb.from('site_settings').select('*').eq('id',1).maybeSingle(),
    sb.from('messages').select('*').order('created_at',{ascending:false})
  ]);
  const errs = results.map(r=>r.error).filter(Boolean);
  if(errs.length){
    document.getElementById('errbanner').innerHTML = '<div style="background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.35);color:#ffb3b3;font-size:12px;padding:8px 14px;border-radius:10px;margin-bottom:12px">هەڵەی بارکردنی داتا: '+esc(errs[0].message)+'</div>';
  }
  const [{data:cats}, {data:books}, {data:posts}, {data:admins}, {data:settings}, {data:messages}] = results;
  DATA.cats = cats||[]; DATA.books = books||[]; DATA.posts = posts||[];
  DATA.admins = admins||[]; DATA.settings = settings||null;
  const now = new Date();
  DATA.messages = (messages||[]).filter(m => !m.expires_at || new Date(m.expires_at) > now);
  if (new URLSearchParams(location.search).get('debug') === '1') {
    document.getElementById('errbanner').innerHTML += '<div style="font-size:11px;color:var(--txt3);margin-bottom:8px">[debug] messages raw: '+(messages?messages.length:'null/error')+' &middot; چالاک: '+DATA.messages.length+'</div>';
  }
  renderTicker();
  render();
}

function renderTicker(){
  const el = document.getElementById('ticker');
  if (!DATA.messages.length){ el.innerHTML=''; return; }
  const text = DATA.messages.map(m => esc(m.body)).join(' &nbsp;&nbsp;&middot;&nbsp;&nbsp; ');
  const seg = `<span dir="rtl">${text}</span>`;
  el.innerHTML = `<span class="ticker-badge" title="ئاگادارکردنەوە"><span class="dot"></span>📢</span><span class="ticker-viewport"><span class="ticker-track">${seg}${seg}</span></span>`;
}

}
// Recognizes a Google Drive share link in any of its common forms and pulls out the file id,
// so a PDF added by pasting a normal "Share" link from Drive still reads/downloads correctly.
function driveFileId(url){
  const m = String(url||'').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^#]*[?&]id=)([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function pdfRead(b){
  sb.rpc('bump_book_reads', { p_id: b.id }).then(()=>{});
  const id = driveFileId(b.pdf_url);
  // Drive's own viewer embeds/opens far more reliably than the raw share link
  window.open(id ? `https://drive.google.com/file/d/${id}/preview` : b.pdf_url, '_blank');
}
async function pdfDownload(b){
  sb.rpc('bump_book_downloads', { p_id: b.id }).then(()=>{});
  const id = driveFileId(b.pdf_url);
  if (id){
    // Google's own direct-download endpoint sends a real "attachment" header,
    // so a plain navigation saves the file instead of opening Drive's viewer page.
    location.href = `https://drive.google.com/uc?export=download&id=${id}`;
    return;
  }
  // For a direct file link (e.g. Supabase Storage), the browser often just opens the PDF
  // inline instead of saving it. Fetching it as a blob forces a real save-to-device download.
  try {
    const res = await fetch(b.pdf_url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (b.title || 'book') + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  } catch (e) {
    // CORS or network issue: fall back to opening it so the visitor can save it manually
    window.open(b.pdf_url, '_blank');
  }
}

const SORTERS = {
  new: (a,b) => new Date(b.created_at) - new Date(a.created_at),
  views: (a,b) => (b.views||0) - (a.views||0),
  reads: (a,b) => (b.reads||0) - (a.reads||0),
  downloads: (a,b) => (b.downloads||0) - (a.downloads||0)
};
function filteredBooks(){
  let list = DATA.books;
  if (activeCat === '__fav__') { const favs = getFavs(); list = list.filter(b => favs.includes(String(b.id))); }
  else if (activeCat) list = list.filter(b => String(b.category_id) === String(activeCat));
  list = list.slice().sort(SORTERS[activeSort] || SORTERS.new);
  return list;
}

function renderHome(){
  const el = document.getElementById('app');
  const list = filteredBooks();
  const catOpts = `<option value="" ${!activeCat?'selected':''}>هەموو پۆلەکان</option>` +
    DATA.cats.map(c=>`<option value="${c.id}" ${String(activeCat)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('') +
    `<option value="__fav__" ${activeCat==='__fav__'?'selected':''}>♥ دڵخوازەکان</option>`;
  const chips = `<div class="cat-filter"><select id="catSel" class="sort-sel">${catOpts}</select></div>`;
  const sortOpts = [
    ['new','نوێترین'], ['views','زۆرترین بینراو'], ['reads','زۆرترین خوێندراوە'], ['downloads','زۆرترین داگیراو']
  ].map(([v,l])=>`<option value="${v}" ${activeSort===v?'selected':''}>${l}</option>`).join('');
  el.innerHTML = statsBar() + chips +
    `<div class="searchrow">
       <div class="search"><span class="search-ic">🔍</span><input id="search" placeholder="گەڕان بۆ کتێب یان نووسەر..."></div>
       <select id="sortSel" class="sort-sel">${sortOpts}</select>
     </div>` +
    `<div class="grid" id="grid">${list.length ? list.map(bookCard).join('') : '<div class="empty">هیچ کتێبێک نیە</div>'}</div>`;
  bindHome();
}

function bindHome(){
  const catSel = document.getElementById('catSel');
  if (catSel) catSel.addEventListener('change', () => { activeCat = catSel.value || null; renderHome(); });
  const sortSel = document.getElementById('sortSel');
  if (sortSel) sortSel.addEventListener('change', () => { activeSort = sortSel.value; renderHome(); });
  const s = document.getElementById('search');
  if (s) s.addEventListener('input', () => {
    const q = s.value.trim().toLowerCase();
    let list = filteredBooks();
    if (q) list = list.filter(b => (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q));
    document.getElementById('grid').innerHTML = list.length ? list.map(bookCard).join('') : '<div class="empty">هیچ نەدۆزرایەوە</div>';
    bindCards();
  });
  bindCards();
}

function bindCards(){
  document.querySelectorAll('[data-book]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('[data-fav]') || e.target.closest('[data-share]') || e.target.closest('[data-pdfread]') || e.target.closest('[data-pdfdl]')) return;
    openBook(el.dataset.book);
  }));
  document.querySelectorAll('[data-pdfread]').forEach(it => it.addEventListener('click', e => {
    e.stopPropagation();
    const b = DATA.books.find(x => String(x.id) === String(it.dataset.pdfread));
    if (b) pdfRead(b);
  }));
  document.querySelectorAll('[data-pdfdl]').forEach(it => it.addEventListener('click', e => {
    e.stopPropagation();
    const b = DATA.books.find(x => String(x.id) === String(it.dataset.pdfdl));
    if (b) pdfDownload(b);
  }));
  document.querySelectorAll('[data-fav]').forEach(it => it.addEventListener('click', e => {
    e.stopPropagation();
    const id = it.dataset.fav;
    toggleFav(id);
    const nowFav = getFavs().includes(String(id));
    it.textContent = nowFav ? '♥' : '♡';
    it.classList.toggle('on', nowFav);
    it.classList.remove('pulse');
    void it.offsetWidth;
    it.classList.add('pulse');
    showFavToast(nowFav);
    if (activeCat === '__fav__' && !nowFav) renderHome();
  }));
  document.querySelectorAll('[data-share]').forEach(it => it.addEventListener('click', e => {
    shareItem('book', it.dataset.share, it.dataset.title, e);
  }));
}

function showToast(msg){
  let t = document.getElementById('favToast');
  if (!t){
    t = document.createElement('div');
    t.id = 'favToast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function showFavToast(added){ showToast(added ? '♥ زیادکرا بۆ دڵخوازەکان' : '♡ لابرا لە دڵخوازەکان'); }

function shareUrl(kind, id){
  if (kind === 'book' || kind === 'post'){
    return 'https://black-scene-ca27.booksprozha.workers.dev/?type=' + kind + '&id=' + encodeURIComponent(id);
  }
  return location.origin + location.pathname + '#/' + kind + '/' + id;
}
async function shareItem(kind, id, title, ev){
  if (ev) ev.stopPropagation();
  const url = shareUrl(kind, id);
  if (navigator.share){
    try{ await navigator.share({ title: title || 'کتێبخانە', url }); return; }catch(e){ /* cancelled — fall through to copy */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    showToast('🔗 لینک کۆپی کرا بۆ هاوبەشکردن');
  }catch(e){
    window.prompt('لینکی هاوبەشکردن:', url);
  }
}

function openBook(id){
  const b = DATA.books.find(x => String(x.id) === String(id));
  if (!b) return;
  bumpViewOnce('book', b.id);
  const hasBio = b.author_bio && b.author_bio.trim();
  document.getElementById('modal').innerHTML = `
    <div class="mclose" id="mclose">&#10005; داخستن</div>
    <div class="mshare" id="mshare">${SHARE_SVG} هاوبەشکردن</div>
    <div class="mcover">${b.cover_url ? `<img src="${esc(b.cover_url)}">` : '📖'}</div>
    <h3>${esc(b.title)}</h3>
    <p class="msub">${esc(b.author)}${hasBio?` <button class="bio-btn" id="bioBtn">دەربارەی نووسەر</button>`:''}</p>
    ${hasBio?`<div class="bio-box" id="bioBox" style="display:none">${esc(b.author_bio)}</div>`:''}
    <p class="msub2">
      <span>${EYE_SVG} <bdi>${b.views||0}</bdi> بینین</span>
      ${b.pdf_url?`<span>📖 <bdi>${b.reads||0}</bdi> خوێندنەوە</span><span>⬇️ <bdi>${b.downloads||0}</bdi> داگرتن</span>`:''}
      <span class="meta-date"><bdi>${fmtDate(b.created_at)}</bdi></span>
    </p>
    ${b.admin_profiles?`<p class="added-by">زیادکراوە لەلایەن ${esc(b.admin_profiles.name)}</p>`:''}
    <p class="mbody">${esc(b.summary || 'هیچ پوختەیەک نووسراوە نییە.')}</p>
    ${b.pdf_url?`
      <div class="pdf-acts">
        <button class="btn-pdf read" id="pdfReadBtn">📖 خوێندنەوەی PDF</button>
        <button class="btn-pdf dl" id="pdfDlBtn">⬇️ داگرتنی PDF</button>
      </div>`:''}`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('mclose').onclick = closeModal;
  document.getElementById('mshare').onclick = () => shareItem('book', b.id, b.title);
  const bioBtn = document.getElementById('bioBtn');
  if (bioBtn) bioBtn.onclick = () => {
    const box = document.getElementById('bioBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  };
  const readBtn = document.getElementById('pdfReadBtn');
  if (readBtn) readBtn.onclick = () => pdfRead(b);
  const dlBtn = document.getElementById('pdfDlBtn');
  if (dlBtn) dlBtn.onclick = () => pdfDownload(b);
}

function openPost(id){
  const p = DATA.posts.find(x => String(x.id) === String(id));
  if (!p) return;
  bumpViewOnce('post', p.id);
  const when = `<bdi>${new Date(p.created_at).toLocaleDateString('en-GB')}</bdi>`;
  let meta = `${when} &middot; ${EYE_SVG} <bdi>${p.views||0}</bdi>`;
  if (p.type === 'seminar') meta = `<bdi>${esc(p.event_date||'')} ${esc(p.event_time||'')}</bdi> &middot; 📍 ${esc(p.location||'')} &middot; ${EYE_SVG} <bdi>${p.views||0}</bdi>`;
  document.getElementById('modal').innerHTML = `
    <div class="mclose" id="mclose">&#10005; داخستن</div>
    <div class="mshare" id="mshare">${SHARE_SVG} هاوبەشکردن</div>
    ${p.cover_url?`<div class="mcover"><img src="${esc(p.cover_url)}"></div>`:''}
    <h3>${esc(p.title)}</h3>
    <p class="msub">${meta}</p>
    ${p.admin_profiles?`<p class="added-by">زیادکراوە لەلایەن ${esc(p.admin_profiles.name)}</p>`:''}
    ${(p.type==='audiobook'&&p.audio_url)?`<button class="btn-pdf read" id="maudio" style="margin:10px 0">🎧 گوێگرتن</button>`:''}
    <p class="mbody">${esc(p.body||'')}</p>
    ${(p.images&&p.images.length)?`<div class="gallery">${p.images.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}"></a>`).join('')}</div>`:''}`;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('mclose').onclick = closeModal;
  document.getElementById('mshare').onclick = () => shareItem('post', p.id, p.title);
  const maudio = document.getElementById('maudio');
  if (maudio) maudio.onclick = () => window.open(audiobookUrl(p.audio_url), '_blank');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

let postSearchQ = { article:'', seminar:'', activity:'', news:'', selfdev:'', course:'', audiobook:'' };
function typeIcon(type){
  return type==='activity'?'📷':type==='news'?'📰':type==='selfdev'?'🌱':type==='course'?'🎓':type==='audiobook'?'🎧':type==='seminar'?'🎤':'✍️';
}
function audiobookUrl(url){
  // Audiobook links can be a Drive file, or a plain link shared from
  // WhatsApp/Telegram/YouTube etc. — for Drive we jump to Google's own
  // viewer/player; everything else we open exactly as given.
  const id = driveFileId(url);
  return id ? `https://drive.google.com/file/d/${id}/preview` : (url||'');
}
function postCard(p, type){
  const cover = p.cover_url || (p.images && p.images[0]);
  let badge = '';
  if (type === 'seminar'){
    const d = p.event_date ? new Date(p.event_date) : null;
    const isPast = d && d < new Date(new Date().toDateString());
    badge = `<span class="badge">${d ? (isPast?'تەواوبوو':d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})) : ''}</span>`;
  } else if (p.images && p.images.length){
    badge = `<span class="badge">+${p.images.length} 🖼</span>`;
  }
  const metaExtra = type==='seminar'
    ? `${p.location?`<span class="meta-date">📍 ${esc(p.location)}</span>`:''}`
    : `<span class="meta-date">${fmtDate(p.created_at)}</span>`;
  const audioRow = (type==='audiobook' && p.audio_url)
    ? `<div class="card-pdf-row">
        <button class="pdf-mini read" data-audiolink="${esc(audiobookUrl(p.audio_url))}">🎧 گوێگرتن</button>
      </div>`
    : '';
  return `<div class="card" data-post="${p.id}">
    <div class="cover">
      ${cover ? `<img src="${esc(cover)}">` : typeIcon(type)}
      ${badge}
      <span class="share-btn" data-share-post="${p.id}" data-title="${esc(p.title)}">${SHARE_SVG}</span>
    </div>
    <p class="title">${esc(p.title)}</p>
    <div class="meta-row"><span>${EYE_SVG} <bdi>${p.views||0}</bdi></span>${metaExtra}</div>
    ${p.admin_profiles?`<p class="added-by">زیادکراوە لەلایەن ${esc(p.admin_profiles.name)}</p>`:''}
    ${audioRow}
  </div>`;
}
function postsListHTML(type, emptyText){
  const q = (postSearchQ[type]||'').trim().toLowerCase();
  let list = DATA.posts.filter(p => p.type === type);
  if (q) list = list.filter(p => (p.title||'').toLowerCase().includes(q) || (p.body||'').toLowerCase().includes(q));
  if (!list.length) return `<div class="empty">${q?'هیچ نەدۆزرایەوە':emptyText}</div>`;
  return list.map(p => postCard(p, type)).join('');
}
function bindPostRows(){
  document.querySelectorAll('[data-post]').forEach(r => r.onclick = (e) => {
    if(e.target.closest('[data-share-post]') || e.target.closest('[data-audiolink]')) return;
    openPost(r.dataset.post);
  });
  document.querySelectorAll('[data-share-post]').forEach(it => it.addEventListener('click', e => {
    e.stopPropagation();
    shareItem('post', it.dataset.sharePost, it.dataset.title, e);
  }));
  document.querySelectorAll('[data-audiolink]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    window.open(btn.dataset.audiolink, '_blank');
  }));
}
function renderPostsList(type, title, emptyText){
  const el = document.getElementById('app');
  el.innerHTML = `<h2 class="section">${title}</h2>` +
    `<div class="search"><span class="search-ic">🔍</span><input id="postSearch" placeholder="گەڕان..." value="${esc(postSearchQ[type]||'')}"></div>` +
    `<div class="grid" id="postList">${postsListHTML(type, emptyText)}</div>`;
  const sInp = document.getElementById('postSearch');
  if (sInp) sInp.addEventListener('input', () => {
    postSearchQ[type] = sInp.value;
    document.getElementById('postList').innerHTML = postsListHTML(type, emptyText);
    bindPostRows();
  });
  bindPostRows();
}

function renderAuthors(){
  const el = document.getElementById('app');
  const map = new Map();
  DATA.books.forEach(b => {
    const name = (b.author||'').trim();
    if (!name) return;
    if (!map.has(name)) map.set(name, { name, bio:'', books:[] });
    const a = map.get(name);
    if (b.author_bio && !a.bio) a.bio = b.author_bio;
    a.books.push(b);
  });
  const authors = Array.from(map.values()).sort((x,y)=>y.books.length-x.books.length);
  const q = (authorSearchQ||'').trim().toLowerCase();
  const list = q ? authors.filter(a=>a.name.toLowerCase().includes(q)) : authors;
  el.innerHTML = `<h2 class="section">نووسەرەکان</h2>` +
    `<div class="search"><span class="search-ic">🔍</span><input id="authorSearch" placeholder="گەڕان بۆ نووسەر..." value="${esc(authorSearchQ||'')}"></div>` +
    `<div class="admins" id="authorList">${authorsHTML(list)}</div>`;
  const s = document.getElementById('authorSearch');
  if (s) s.addEventListener('input', () => {
    authorSearchQ = s.value;
    const qq = authorSearchQ.trim().toLowerCase();
    const l2 = qq ? authors.filter(a=>a.name.toLowerCase().includes(qq)) : authors;
    document.getElementById('authorList').innerHTML = authorsHTML(l2);
    bindAuthorCards();
  });
  bindAuthorCards();
}
function authorsHTML(list){
  if (!list.length) return '<div class="empty">هیچ نووسەرێک نیە</div>';
  return list.map(a => `
    <div class="admin-card" data-author="${esc(a.name)}" style="cursor:pointer">
      <div class="avatar">${esc((a.name||'?').slice(0,1))}</div>
      <p class="name">${esc(a.name)}</p>
      <p class="role">${esc(a.bio ? (a.bio.length>80?a.bio.slice(0,80)+'…':a.bio) : (a.books.length+' کتێب'))}</p>
    </div>`).join('');
}
function bindAuthorCards(){
  document.querySelectorAll('[data-author]').forEach(c => c.onclick = () => {
    activeCat = null;
    const name = c.dataset.author;
    const el = document.getElementById('app');
    const books = DATA.books.filter(b => (b.author||'').trim() === name);
    const bio = (books.find(b=>b.author_bio)||{}).author_bio || '';
    el.innerHTML = `<div class="about-card">
        <h3>${esc(name)}</h3>
        ${bio?`<p>${esc(bio)}</p>`:''}
      </div>
      <div class="section-head"><span class="section-dot"></span><p>کتێبەکانی ئەم نووسەرە</p></div>
      <div class="grid">${books.map(bookCard).join('')}</div>`;
    bindCards();
  });
}
let authorSearchQ = '';

function renderBuyPlaceholder(){
  const el = document.getElementById('app');
  el.innerHTML = `<div class="about-card">
    <h3>کڕینی کتێب</h3>
    <p>ئەم بەشە بەم زووانە چالاک دەبێت. چاوەڕێی نوێکردنەوەکانمان بن.</p>
  </div>`;
}

function renderAbout(){
  const el = document.getElementById('app');
  const s = DATA.settings || {};
  const socialIcon = (url, icon, label) => url ? `<a href="${esc(url)}" target="_blank" class="social-pill">${icon}<span>${label}</span></a>` : '';
  el.innerHTML = `
    <div class="about-card">
      <h3>دەربارەی پڕۆژە</h3>
      <p>پڕۆژەی کتێب هەوڵدانێکە بۆ بڵاوکردنەوەی خوێندنەوە و خۆشەویستی کتێب لەناو کۆمەڵگەدا.</p>
      <div class="social-row">
        ${socialIcon(s.facebook_url, FB_SVG, 'فەیسبوک')}
        ${socialIcon(s.instagram_url, IG_SVG, 'ئینستاگرام')}
        ${socialIcon(s.youtube_url, YT_SVG, 'یوتیوب')}
      </div>
    </div>
    <div class="section-head"><span class="section-dot"></span><p>تیمی ئادمین</p></div>
    <div class="admins">
      ${DATA.admins.map(a => `
        <div class="admin-card">
          <div class="avatar">${a.photo_url?`<img src="${esc(a.photo_url)}">`:esc((a.name||'?').slice(0,1))}</div>
          <p class="name">${esc(a.name)}</p>
          <p class="role">${esc(a.bio||'')}</p>
          <div class="admin-socials">
            ${a.facebook_url?`<a href="${esc(a.facebook_url)}" target="_blank">${FB_SVG}</a>`:''}
            ${a.instagram_url?`<a href="${esc(a.instagram_url)}" target="_blank">${IG_SVG}</a>`:''}
            ${a.youtube_url?`<a href="${esc(a.youtube_url)}" target="_blank">${YT_SVG}</a>`:''}
          </div>
        </div>`).join('') || '<div class="empty">هیچ ئادمینێک نیە</div>'}
    </div>
    <footer class="site">
      <p>کتێبخانە &middot; پڕۆژەی کتێب</p>
      <p>ئەم ویب سایتە دروستکراوە لەلایەن بیلال کامەران</p>
    </footer>`;
}

function render(){
  setActiveNav();
  const r = route();
  if (r === '/posts') renderPostsList('article','وتارەکان','هیچ وتارێک نیە');
  else if (r === '/seminars') renderPostsList('seminar','سیمینارەکان','هیچ سیمینارێک نیە');
  else if (r === '/activities') renderPostsList('activity','چالاکییەکانی پڕۆژە','هیچ چالاکییەک نیە');
  else if (r === '/news') renderPostsList('news','هەواڵەکان','هیچ هەواڵێک نیە');
  else if (r === '/authors') renderAuthors();
  else if (r === '/buy') renderBuyPlaceholder();
  else if (r === '/audiobooks') renderPostsList('audiobook','کتێبی دەنگی','هیچ کتێبێکی دەنگی نیە');
  else if (r === '/selfdev') renderPostsList('selfdev','گەشەپێدان','هیچ بابەتێک نیە');
  else if (r === '/courses') renderPostsList('course','خولەکان','هیچ خولێک نیە');
  else if (r === '/about') renderAbout();
  else if (r.indexOf('/book/') === 0) { renderHome(); openBook(r.slice(6)); }
  else if (r.indexOf('/post/') === 0) { renderHome(); openPost(r.slice(6)); }
  else renderHome();
}

window.addEventListener('hashchange', render);
loadAll();
</script>
