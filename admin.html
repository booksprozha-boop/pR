<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پانێلی ئادمین - کتێبخانە</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg1:#0d0f0e; --bg2:#000000;
  --glass:rgba(255,255,255,.13); --glass-2:rgba(255,255,255,.2);
  --gborder:rgba(255,255,255,.26); --gborder-2:rgba(255,255,255,.38);
  --txt:#fff; --txt2:rgba(255,255,255,.65); --txt3:rgba(255,255,255,.45);
  --blue:#1877f2; --purple:#0d5dc9; --gold:#eaf5ff; --red:#ff6b6b;
  --acc1:rgba(24,119,242,.28); --acc2:rgba(13,93,201,.24);
}
html[data-theme="light"]{
  --bg1:#f7f8fa; --bg2:#eceef2;
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.93);
  --gborder:rgba(100,106,122,.16); --gborder-2:rgba(100,106,122,.28);
  --txt:#20232b; --txt2:rgba(32,35,43,.62); --txt3:rgba(32,35,43,.42);
  --acc1:rgba(24,119,242,.12); --acc2:rgba(13,93,201,.1);
}
*{box-sizing:border-box}
html{transition:background .25s}
body{margin:0;min-height:100vh;background:
    radial-gradient(900px 500px at 15% -10%, var(--acc1), transparent 60%),
    radial-gradient(800px 500px at 110% 10%, var(--acc2), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  color:var(--txt);font-family:'Vazirmatn',-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.8;transition:color .2s}
h1,h2,h3,.section{font-weight:800}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--blue),var(--purple));border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--purple),var(--blue));background-clip:padding-box}
*{scrollbar-color:var(--blue) transparent}
.logo .mark{position:relative;overflow:hidden}
.logo .mark::after{content:'';position:absolute;top:-50%;left:-150%;width:60%;height:200%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:markShine 4.5s ease-in-out infinite}
@keyframes markShine{0%,55%{left:-150%}100%{left:200%}}
.theme-btn{width:32px;height:32px;border-radius:50%;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--txt);flex-shrink:0;transition:transform .15s}
.theme-btn:hover{transform:scale(1.08) rotate(10deg)}
.wrap{max-width:960px;margin:0 auto;padding:20px 20px 60px}
a{color:inherit}
h1{font-size:19px;margin:0}
h2.section{font-size:16px;font-weight:600;margin:0 0 14px}
.card{position:relative;overflow:hidden;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 26px rgba(0,0,0,.35);border-radius:14px;padding:18px}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 50%);pointer-events:none}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple) 60%,var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(24,119,242,.35);display:flex;align-items:center;justify-content:center;font-size:16px}
.btn{position:relative;overflow:hidden;backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -8px 12px -8px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.08);color:var(--txt);font-size:13px;font-weight:600;padding:10px 18px;border-radius:13px;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease}
.btn::before{content:'';position:absolute;top:0;left:10%;right:10%;height:45%;border-radius:50px;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);opacity:.8;pointer-events:none}
.btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 55%);opacity:.5;pointer-events:none}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 12px -8px rgba(0,0,0,.1),0 12px 26px rgba(24,119,242,.2)}
.btn:active{transform:translateY(-1px) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:rgba(255,255,255,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -8px 12px -8px rgba(0,0,0,.2),0 8px 20px rgba(24,119,242,.4);color:#fff}
.btn.danger{background:linear-gradient(135deg,#c0392b,#962d22);border-color:rgba(255,255,255,.3);color:#fff}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{position:relative;overflow:hidden;backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -8px 12px -8px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.08);color:var(--txt2);font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:13px;cursor:pointer;white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,color .15s}
.tab::before{content:'';position:absolute;top:0;left:10%;right:10%;height:45%;border-radius:50px;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);opacity:.75;pointer-events:none}
.tab:hover{transform:translateY(-3px) scale(1.02);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 12px -8px rgba(0,0,0,.1),0 10px 22px rgba(24,119,242,.18);color:var(--txt)}
.tab:active{transform:translateY(-1px) scale(.98)}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -8px 12px -8px rgba(0,0,0,.2),0 8px 20px rgba(24,119,242,.35)}
label{display:block;font-size:12px;color:var(--txt2);margin:10px 0 5px}
input,textarea,select{width:100%;backdrop-filter:blur(14px);background:var(--glass);border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);border-radius:9px;padding:9px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
textarea{min-height:90px;resize:vertical}
select option{background:#1c1f2a;color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.item{position:relative;overflow:hidden;backdrop-filter:blur(18px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gtable{margin-top:16px;overflow-x:auto}
.gtable .ghead,.gtable .grow{display:grid;grid-template-columns:var(--gcols,44px 2fr 1fr 70px auto);gap:12px;align-items:center}
.gtable .ghead{padding:0 16px;margin-bottom:8px;font-size:11px;color:var(--txt2);font-weight:700}
.gtable .gbody{display:flex;flex-direction:column;gap:8px}
.gtable .grow{position:relative;overflow:hidden;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--gborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.1);border-radius:12px;padding:10px 16px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,border-color .25s ease}
.gtable .grow:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 24px rgba(24,119,242,.18);border-color:var(--gborder-2)}
.gtable .gthumb{width:40px;height:40px;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt3);flex-shrink:0}
.gtable .gthumb img{width:100%;height:100%;object-fit:cover}
.gtable .gcell{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtable .gcell.t{font-weight:700}
.gtable .gcell.sub{color:var(--txt2);font-size:11px;display:block;font-weight:400}
.gtable .gtag{display:inline-block;background:linear-gradient(135deg,rgba(24,119,242,.24),rgba(13,93,201,.18));border:1px solid rgba(24,119,242,.3);color:var(--txt);font-size:10.5px;padding:3px 9px;border-radius:7px;white-space:nowrap}
.gtable .gacts{display:flex;gap:6px;justify-content:flex-start;flex-wrap:nowrap}
@media (max-width:720px){.gtable .ghead,.gtable .grow{min-width:480px}}
.item .t{font-weight:600;font-size:13.5px}
.item .s{font-size:11.5px;color:var(--txt2)}
.item .acts{display:flex;gap:6px}
.msg{font-size:12.5px;padding:8px 12px;border-radius:8px;margin-top:10px}
.msg.err{background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.35);color:#ffb3b3}
.msg.ok{background:rgba(24,119,242,.15);border:1px solid rgba(24,119,242,.35);color:#bcd0ff}
#loginScreen{max-width:380px;margin:80px auto}
.hidden{display:none}
.avatarprev{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--glass);border:1px solid var(--gborder)}
.empty{color:var(--txt2);font-size:13px;padding:20px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<div id="loginScreen">
  <div class="card">
    <div class="logo" style="margin-bottom:16px"><span class="mark">📖</span><h1>چوونەژوورەوەی ئادمین</h1></div>
    <label>ئیمەیل</label>
    <input id="loginEmail" type="email" placeholder="admin@example.com">
    <label>وشەی نهێنی</label>
    <input id="loginPass" type="password" placeholder="••••••••">
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="doLogin()">چوونەژوورەوە</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="dash" class="hidden">
  <div class="topbar">
    <div class="logo"><span class="mark">📖</span><h1>پانێلی ئادمین</h1></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="theme-btn" id="themeBtn" title="گۆڕینی دارک مۆد">🌙</span>
      <span id="whoami" style="font-size:12.5px;color:var(--txt2)"></span>
      <button class="btn sm" onclick="doLogout()">چوونەدەرەوە</button>
      <a href="index.html" class="btn sm">بینینی سایت</a>
    </div>
  </div>

  <div class="tabs">
    <div class="tab" data-tab="books">کتێبەکان</div>
    <div class="tab" data-tab="article">وتار</div>
    <div class="tab" data-tab="seminar">سیمینار</div>
    <div class="tab" data-tab="activity">چالاکی</div>
    <div class="tab" data-tab="profile">پڕۆفایلم</div>
    <div class="tab" data-tab="settings">ڕێکخستنەکان</div>
    <div class="tab" data-tab="ticker">ئاگادارکردنەوە</div>
  </div>

  <div id="panel"></div>
</div>

</div>

<script>
const SUPABASE_URL = 'https://viynxaoruqktjgakgygv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CAGeHeQS8MLUAur6pKCXcg_ilMREtnL';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = t==='light' ? '☀️' : '🌙';
  try{ localStorage.setItem('theme', t); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('theme'); }catch(e){}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
})();
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('themeBtn');
  if(btn){
    btn.textContent = document.documentElement.getAttribute('data-theme')==='light' ? '☀️' : '🌙';
    btn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur === 'light' ? 'dark' : 'light');
    });
  }
});

let ME = null; // {id, name, ...}
let CATS = [];
let activeTab = 'books';

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function uploadImage(bucket, file, urlInputId, msgElId, previewId){
  const msgEl = document.getElementById(msgElId);
  if(msgEl) msgEl.innerHTML = '<div class="msg ok">ئەپلۆدکردن...</div>';
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '.' + ext;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert: true });
  if(error){
    if(msgEl) msgEl.innerHTML = '<div class="msg err">هەڵەی ئەپلۆد: '+esc(error.message)+'</div>';
    return;
  }
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  document.getElementById(urlInputId).value = data.publicUrl;
  if(msgEl) msgEl.innerHTML = '<div class="msg ok">وێنە ئەپلۆد کرا ✓</div>';
  if(previewId){ const p = document.getElementById(previewId); if(p){ p.src = data.publicUrl; p.style.display='inline-block'; } }
}
async function uploadImageReturnUrl(bucket, file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()) + '.' + ext;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert: true });
  if(error) return null;
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msgEl = document.getElementById('loginMsg');
  msgEl.innerHTML = '';
  if(!email || !pass){ msgEl.innerHTML = '<div class="msg err">ئیمەیل و وشەی نهێنی پڕبکەرەوە</div>'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ msgEl.innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  await checkAdmin();
}

async function checkAdmin(){
  const { data: { user }, error: uerr } = await sb.auth.getUser();
  if(uerr){ document.getElementById('loginMsg').innerHTML = '<div class="msg err">هەڵەی getUser: '+esc(uerr.message)+'</div>'; return; }
  if(!user){ return; }
  const { data: prof, error: perr } = await sb.from('admin_profiles').select('*').eq('id', user.id).maybeSingle();
  if(perr){ document.getElementById('loginMsg').innerHTML = '<div class="msg err">هەڵەی خوێندنەوە: '+esc(perr.message)+' (UID: '+esc(user.id)+')</div>'; return; }
  if(!prof){
    await sb.auth.signOut();
    document.getElementById('loginMsg').innerHTML = '<div class="msg err">ئەم هەژمارە ئادمین نیە (UID: '+esc(user.id)+')</div>';
    return;
  }
  ME = prof;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
  document.getElementById('whoami').textContent = 'بەخێربێیت ' + (ME.name || '');
  await loadCats();
  bindTabs();
  renderTab();
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

async function loadCats(){
  const { data } = await sb.from('categories').select('*').order('id');
  CATS = data || [];
}

function bindTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ activeTab = t.dataset.tab; renderTab(); };
  });
}

function markActiveTab(){
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===activeTab));
}

async function renderTab(){
  markActiveTab();
  const panel = document.getElementById('panel');
  panel.innerHTML = '<div class="empty">چاوەڕێبە...</div>';
  if(activeTab==='books') return renderBooks();
  if(['article','seminar','activity'].includes(activeTab)) return renderPosts(activeTab);
  if(activeTab==='profile') return renderProfile();
  if(activeTab==='settings') return renderSettings();
  if(activeTab==='ticker') return renderTicker();
}

/* ---------- BOOKS ---------- */
async function renderBooks(){
  const { data: books } = await sb.from('books').select('*').order('created_at',{ascending:false});
  const catOpts = CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="card">
      <h2 class="section">زیادکردنی کتێبی نوێ</h2>
      <label>ناونیشان</label><input id="b_title">
      <div class="row2">
        <div><label>نووسەر</label><input id="b_author"></div>
        <div><label>پۆل</label><select id="b_cat" onchange="document.getElementById('b_cat_new_wrap').style.display=(this.value==='__new__'?'block':'none')"><option value="">— هیچ —</option>${catOpts}<option value="__new__">+ پۆلی نوێ...</option></select>
          <div id="b_cat_new_wrap" style="display:none;margin-top:6px"><input id="b_cat_new" placeholder="ناوی پۆلی نوێ بنووسە"></div>
        </div>
      </div>
      <label>وێنەی بەرگ</label>
      <input id="b_cover" placeholder="https://... (یان وێنە ئەپلۆد بکە)">
      <input id="b_cover_file" type="file" accept="image/*" style="margin-top:6px">
      <img id="b_cover_prev" style="display:none;max-width:100px;max-height:140px;border-radius:8px;margin-top:8px">
      <div id="b_upload_msg"></div>
      <label>کورتەی کتێب</label><textarea id="b_summary"></textarea>
      <label>فایلی PDF (ئۆپشناڵ)</label>
      <input id="b_pdf" placeholder="لینکی گووگڵ درایڤ یان https://... (یان فایل ئەپلۆد بکە)">
      <div style="font-size:11px;margin-top:4px;color:var(--txt2)">دەتوانیت لینکی Share ـی گووگڵ درایڤ ڕاستەوخۆ بلکێنیت — خۆی دادەگیرێت.</div>
      <input id="b_pdf_file" type="file" accept="application/pdf" style="margin-top:6px">
      <div id="b_pdf_msg"></div>
      <label>ژیاننامەی نووسەر (ئۆپشناڵ)</label><textarea id="b_bio" placeholder="چەند دێڕێک دەربارەی نووسەرەکە..."></textarea>
      <button class="btn primary" style="margin-top:12px" onclick="addBook()">زیادکردن</button>
      <div id="b_msg"></div>
    </div>
    <div class="gtable" id="b_list" style="--gcols:44px 2fr 1fr 70px 70px auto"></div>
  `;
  document.getElementById('b_cover_file').onchange = (e)=>{ const f=e.target.files[0]; if(f) uploadImage('covers', f, 'b_cover', 'b_upload_msg', 'b_cover_prev'); };
  document.getElementById('b_pdf_file').onchange = (e)=>{ const f=e.target.files[0]; if(f) uploadImage('pdfs', f, 'b_pdf', 'b_pdf_msg'); };
  const list = document.getElementById('b_list');
  if(!books || !books.length){ list.innerHTML = '<div class="empty">هیچ کتێبێک نیە</div>'; return; }
  const catName = (id)=> (CATS.find(c=>c.id===id)||{}).name || '';
  list.innerHTML = `
    <div class="ghead"><span>وێنە</span><span>ناونیشان / نووسەر</span><span>پۆل</span><span>بینین</span><span>PDF</span><span>کردار</span></div>
    <div class="gbody">
      ${books.map(b=>`
        <div class="grow">
          <div class="gthumb">${b.cover_url?`<img src="${esc(b.cover_url)}">`:'📖'}</div>
          <div class="gcell t">${esc(b.title)}<span class="sub">${esc(b.author||'')}</span></div>
          <div class="gcell">${b.category_id?`<span class="gtag">${esc(catName(b.category_id))}</span>`:''}</div>
          <div class="gcell">👁 ${b.views||0}</div>
          <div class="gcell">${b.pdf_url?`<span class="gtag">📄 ${b.reads||0}/${b.downloads||0}</span>`:'—'}</div>
          <div class="gacts">
            <button class="btn sm" onclick="editBook(${b.id})">دەستکاری</button>
            <button class="btn sm danger" onclick="delRow('books',${b.id})">سڕینەوە</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
async function addBook(){
  const title = document.getElementById('b_title').value.trim();
  if(!title){ document.getElementById('b_msg').innerHTML='<div class="msg err">ناونیشان پێویستە</div>'; return; }
  let catId = document.getElementById('b_cat').value || null;
  if(catId === '__new__'){
    const newName = document.getElementById('b_cat_new').value.trim();
    if(!newName){ document.getElementById('b_msg').innerHTML='<div class="msg err">ناوی پۆلی نوێ بنووسە</div>'; return; }
    const { data: newCat, error: catErr } = await sb.from('categories').insert({ name: newName }).select().single();
    if(catErr){ document.getElementById('b_msg').innerHTML = '<div class="msg err">هەڵەی پۆل: '+esc(catErr.message)+'</div>'; return; }
    CATS.push(newCat);
    catId = newCat.id;
  }
  const payload = {
    title, author: document.getElementById('b_author').value.trim()||null,
    category_id: catId,
    cover_url: document.getElementById('b_cover').value.trim()||null,
    summary: document.getElementById('b_summary').value.trim()||null,
    pdf_url: document.getElementById('b_pdf').value.trim()||null,
    author_bio: document.getElementById('b_bio').value.trim()||null,
    admin_id: ME.id
  };
  const { error } = await sb.from('books').insert(payload);
  if(error){ document.getElementById('b_msg').innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  renderBooks();
}
async function editBook(id){
  const { data: b } = await sb.from('books').select('*').eq('id',id).single();
  const title = prompt('ناونیشان:', b.title); if(title===null) return;
  const author = prompt('نووسەر:', b.author||'');
  const cover = prompt('لینکی وێنە:', b.cover_url||'');
  const summary = prompt('کورتە:', b.summary||'');
  const pdf_url = prompt('لینکی PDF (یان لینکی Share ـی گووگڵ درایڤ):', b.pdf_url||'');
  const author_bio = prompt('ژیاننامەی نووسەر:', b.author_bio||'');
  await sb.from('books').update({title, author, cover_url:cover, summary, pdf_url, author_bio}).eq('id',id);
  renderBooks();
}
async function delRow(table,id){
  if(!confirm('دڵنیایت لە سڕینەوە؟')) return;
  await sb.from(table).delete().eq('id',id);
  renderTab();
}

/* ---------- POSTS (article/seminar/activity) ---------- */
const typeLabel = {article:'وتار', seminar:'سیمینار', activity:'چالاکی'};
let NEW_POST_GALLERY = [];
async function renderPosts(type){
  const { data: posts } = await sb.from('posts').select('*').eq('type',type).order('created_at',{ascending:false});
  const panel = document.getElementById('panel');
  const isSem = type==='seminar';
  const multiGallery = (type==='seminar' || type==='activity');
  NEW_POST_GALLERY = [];
  panel.innerHTML = `
    <div class="card">
      <h2 class="section">زیادکردنی ${typeLabel[type]}ی نوێ</h2>
      <label>ناونیشان</label><input id="p_title">
      ${isSem ? `
      <div class="row2">
        <div><label>بەروار</label><input id="p_date" type="date"></div>
        <div><label>کات</label><input id="p_time" type="time"></div>
      </div>
      <label>شوێن</label><input id="p_loc">` : ''}
      <label>وێنە</label>
      <input id="p_cover" placeholder="https://... (یان وێنە ئەپلۆد بکە)">
      <input id="p_cover_file" type="file" accept="image/*" style="margin-top:6px">
      <img id="p_cover_prev" style="display:none;max-width:100px;max-height:140px;border-radius:8px;margin-top:8px">
      <div id="p_upload_msg"></div>
      ${multiGallery?`
      <label>وێنەی زیاتر (دەتوانیت چەند وێنەیەک پێکەوە هەڵبژێریت)</label>
      <input id="p_gallery_file" type="file" accept="image/*" multiple style="margin-top:6px">
      <div id="p_gallery_msg"></div>
      <div id="p_gallery_prev" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
      `:''}
      <label>ناوەڕۆک</label><textarea id="p_body"></textarea>
      <button class="btn primary" style="margin-top:12px" onclick="addPost('${type}')">زیادکردن</button>
      <div id="p_msg"></div>
    </div>
    <div class="gtable" id="p_list" style="--gcols:44px 2fr 1fr 60px auto"></div>
  `;
  document.getElementById('p_cover_file').onchange = (e)=>{ const f=e.target.files[0]; if(f) uploadImage('covers', f, 'p_cover', 'p_upload_msg', 'p_cover_prev'); };
  if (multiGallery){
    document.getElementById('p_gallery_file').onchange = async (e)=>{
      const files = Array.from(e.target.files||[]);
      const msg = document.getElementById('p_gallery_msg');
      msg.innerHTML = '<div class="msg">باركردن...</div>';
      for(const f of files){
        const url = await uploadImageReturnUrl('covers', f);
        if(url) NEW_POST_GALLERY.push(url);
      }
      msg.innerHTML = NEW_POST_GALLERY.length ? `<div class="msg ok">${NEW_POST_GALLERY.length} وێنە ئامادەیە</div>` : '';
      document.getElementById('p_gallery_prev').innerHTML = NEW_POST_GALLERY.map(u=>`<img src="${esc(u)}" style="width:50px;height:50px;object-fit:cover;border-radius:6px">`).join('');
    };
  }
  const list = document.getElementById('p_list');
  if(!posts || !posts.length){ list.innerHTML = '<div class="empty">هیچ نیە</div>'; return; }
  list.innerHTML = `
    <div class="ghead"><span>وێنە</span><span>ناونیشان</span><span>بەروار</span><span>بینین</span><span>کردار</span></div>
    <div class="gbody">
      ${posts.map(p=>`
        <div class="grow">
          <div class="gthumb">${p.cover_url?`<img src="${esc(p.cover_url)}">`:'📝'}</div>
          <div class="gcell t">${esc(p.title)}${p.images&&p.images.length?`<span class="sub">+${p.images.length} وێنە</span>`:''}</div>
          <div class="gcell">${p.event_date?`<span class="gtag">${esc(p.event_date)}</span>`:''}</div>
          <div class="gcell">👁 ${p.views||0}</div>
          <div class="gacts">
            ${multiGallery?`<button class="btn sm" onclick="addGalleryImages(${p.id},'${type}')">➕وێنە</button>`:''}
            <button class="btn sm" onclick="editPost(${p.id},'${type}')">دەستکاری</button>
            <button class="btn sm danger" onclick="delRow('posts',${p.id})">سڕینەوە</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function addGalleryImages(id, type){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const { data: p } = await sb.from('posts').select('images').eq('id',id).single();
    const existing = (p && p.images) || [];
    const urls = [];
    for(const f of files){
      const url = await uploadImageReturnUrl('covers', f);
      if(url) urls.push(url);
    }
    await sb.from('posts').update({ images: existing.concat(urls) }).eq('id', id);
    renderPosts(type);
  };
  inp.click();
}
async function addPost(type){
  const title = document.getElementById('p_title').value.trim();
  if(!title){ document.getElementById('p_msg').innerHTML='<div class="msg err">ناونیشان پێویستە</div>'; return; }
  const payload = {
    type, title,
    body: document.getElementById('p_body').value.trim()||null,
    cover_url: document.getElementById('p_cover').value.trim()||null,
    images: NEW_POST_GALLERY.length ? NEW_POST_GALLERY.slice() : null,
    admin_id: ME.id
  };
  if(type==='seminar'){
    payload.event_date = document.getElementById('p_date').value || null;
    payload.event_time = document.getElementById('p_time').value || null;
    payload.location = document.getElementById('p_loc').value.trim() || null;
  }
  const { error } = await sb.from('posts').insert(payload);
  if(error){ document.getElementById('p_msg').innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  NEW_POST_GALLERY = [];
  renderPosts(type);
}
async function editPost(id,type){
  const { data: p } = await sb.from('posts').select('*').eq('id',id).single();
  const title = prompt('ناونیشان:', p.title); if(title===null) return;
  const body = prompt('ناوەڕۆک:', p.body||'');
  const cover = prompt('لینکی وێنە:', p.cover_url||'');
  const upd = {title, body, cover_url:cover};
  if(type==='seminar'){
    upd.event_date = prompt('بەروار (YYYY-MM-DD):', p.event_date||'') || null;
    upd.location = prompt('شوێن:', p.location||'') || null;
  }
  await sb.from('posts').update(upd).eq('id',id);
  renderPosts(type);
}

/* ---------- MY PROFILE ---------- */
async function renderProfile(){
  const panel = document.getElementById('panel');
  const { data: admins } = await sb.from('admin_profiles').select('*').order('created_at');
  const ownerId = admins && admins.length ? admins[0].id : null;
  const isOwner = ownerId === ME.id;
  panel.innerHTML = `
    <div class="card">
      <h2 class="section">پڕۆفایلی من</h2>
      <label>ناو</label><input id="pr_name" value="${esc(ME.name||'')}">
      <label>بایۆگرافیا</label><textarea id="pr_bio">${esc(ME.bio||'')}</textarea>
      <label>وێنەی پڕۆفایل</label>
      <input id="pr_photo" value="${esc(ME.photo_url||'')}" placeholder="https://... (یان وێنە ئەپلۆد بکە)">
      <input id="pr_photo_file" type="file" accept="image/*" style="margin-top:6px">
      <img id="pr_photo_prev" src="${esc(ME.photo_url||'')}" style="display:${ME.photo_url?'inline-block':'none'};width:60px;height:60px;border-radius:50%;object-fit:cover;margin-top:8px">
      <div id="pr_upload_msg"></div>
      <div class="row2">
        <div><label>فەیسبوک</label><input id="pr_fb" value="${esc(ME.facebook_url||'')}"></div>
        <div><label>ئینستاگرام</label><input id="pr_ig" value="${esc(ME.instagram_url||'')}"></div>
      </div>
      <label>یوتیوب</label><input id="pr_yt" value="${esc(ME.youtube_url||'')}">
      <button class="btn primary" style="margin-top:12px" onclick="saveProfile()">پاشەکەوتکردن</button>
      <div id="pr_msg"></div>
    </div>

    ${isOwner ? `
    <div class="card" style="margin-top:16px">
      <h2 class="section">زیادکردنی ئادمینی نوێ</h2>
      <p style="font-size:12px;color:#aab;margin:0 0 10px">پێشتر لە Supabase Dashboard → Authentication → Users، یوزەرێک بە ئیمەیل و وشەی نهێنی دروست بکە، پاشان لێرە UID ـی (لە ستوونی UID) و ناوێک بۆی بنووسە.</p>
      <label>UID (لە Authentication → Users ـەوە کۆپی بکە)</label><input id="na_uid" placeholder="e.g. aa549056-2503-49d0-9d5e-35f6f7a630e0">
      <label>ناو</label><input id="na_name" placeholder="ناوی ئادمین">
      <label>وێنە (ئۆپشناڵ — پێویست ناکات)</label>
      <input id="na_photo" placeholder="https://... (یان وێنە ئەپلۆد بکە)">
      <input id="na_photo_file" type="file" accept="image/*" style="margin-top:6px">
      <img id="na_photo_prev" style="display:none;width:50px;height:50px;border-radius:50%;object-fit:cover;margin-top:8px">
      <div id="na_upload_msg"></div>
      <button class="btn primary" style="margin-top:12px" onclick="addAdmin()">زیادکردنی ئادمین</button>
      <div id="na_msg"></div>
    </div>` : ''}

    <div class="list" id="admin_list" style="margin-top:16px">
      ${(admins||[]).map(a=>`
        <div class="item">
          <div><div class="t">${esc(a.name||'(بێ ناو)')}${a.id===ownerId?' 👑':''}</div><div class="s">${esc(a.id)}</div></div>
          <div class="acts">
            ${isOwner && a.id!==ME.id?`<button class="btn sm" onclick="editAdmin('${a.id}')">دەستکاری</button><button class="btn sm danger" onclick="removeAdmin('${a.id}')">لابردنی دەسەڵات</button>`:''}
            ${a.id===ME.id?'<span style="font-size:11px;color:#8a8">تۆیت</span>':''}
          </div>
        </div>
      `).join('') || '<div class="empty">هیچ ئادمینێک نیە</div>'}
    </div>
    <div id="admin_err"></div>
  `;
  document.getElementById('pr_photo_file').onchange = (e)=>{ const f=e.target.files[0]; if(f) uploadImage('avatars', f, 'pr_photo', 'pr_upload_msg', 'pr_photo_prev'); };
  const naFile = document.getElementById('na_photo_file');
  if(naFile) naFile.onchange = (e)=>{ const f=e.target.files[0]; if(f) uploadImage('avatars', f, 'na_photo', 'na_upload_msg', 'na_photo_prev'); };
}
async function addAdmin(){
  const uid = document.getElementById('na_uid').value.trim();
  const name = document.getElementById('na_name').value.trim();
  const photo_url = document.getElementById('na_photo').value.trim() || null;
  const msgEl = document.getElementById('na_msg');
  if(!uid || !name){ msgEl.innerHTML = '<div class="msg err">UID و ناو پێویستە</div>'; return; }
  const { error } = await sb.from('admin_profiles').insert({ id: uid, name, photo_url });
  if(error){ msgEl.innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  msgEl.innerHTML = '<div class="msg ok">ئادمین زیادکرا ✓ — ئێستا دەتوانێت بچێتە ژوورەوە</div>';
  renderProfile();
}
async function removeAdmin(id){
  if(!confirm('دڵنیایت لە لابردنی دەسەڵاتی ئادمینی؟')) return;
  const { error } = await sb.from('admin_profiles').delete().eq('id', id);
  const errEl = document.getElementById('admin_err');
  if(error){ if(errEl) errEl.innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  renderProfile();
}
async function editAdmin(id){
  const { data: a } = await sb.from('admin_profiles').select('*').eq('id',id).single();
  const name = prompt('ناوی ئادمین:', a.name||''); if(name===null) return;
  const photo_url = prompt('لینکی وێنە (بەتاڵی بهێڵەوە بۆ لابردن):', a.photo_url||'');
  const { error } = await sb.from('admin_profiles').update({ name, photo_url: photo_url||null }).eq('id', id);
  const errEl = document.getElementById('admin_err');
  if(error){ if(errEl) errEl.innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  renderProfile();
}
async function saveProfile(){
  const upd = {
    name: document.getElementById('pr_name').value.trim(),
    bio: document.getElementById('pr_bio').value.trim()||null,
    photo_url: document.getElementById('pr_photo').value.trim()||null,
    facebook_url: document.getElementById('pr_fb').value.trim()||null,
    instagram_url: document.getElementById('pr_ig').value.trim()||null,
    youtube_url: document.getElementById('pr_yt').value.trim()||null
  };
  const { error } = await sb.from('admin_profiles').update(upd).eq('id', ME.id);
  const msgEl = document.getElementById('pr_msg');
  if(error){ msgEl.innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  Object.assign(ME, upd);
  document.getElementById('whoami').textContent = 'بەخێربێیت ' + (ME.name || '');
  msgEl.innerHTML = '<div class="msg ok">پاشەکەوت کرا ✓</div>';
}

/* ---------- SITE SETTINGS ---------- */

  const { data: s } = await sb.from('site_settings').select('*').eq('id',1).maybeSingle();
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="card">
      <h2 class="section">لینکە سۆشیالەکانی پڕۆژە</h2>
      <label>فەیسبوک</label><input id="s_fb" value="${esc(s?.facebook_url||'')}">
      <label>ئینستاگرام</label><input id="s_ig" value="${esc(s?.instagram_url||'')}">

}
async function saveSettings(){
  const payload = {
    id: 1,
    facebook_url: document.getElementById('s_fb').value.trim()||null,
    instagram_url: document.getElementById('s_ig').value.trim()||null,
    youtube_url: document.getElementById('s_yt').value.trim()||null
  };

}

/* ---------- TICKER MESSAGES ---------- */
async function renderTicker(){
  const { data: msgs } = await sb.from('messages').select('*').order('created_at',{ascending:false});
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="card">
      <h2 class="section">زیادکردنی ئاگادارکردنەوەی نوێ</h2>
      <label>دەقی ئاگادارکردنەوە</label><textarea id="m_body"></textarea>
      <label>ماوە</label>
      <select id="m_dur">
        <option value="today">تەنها ئەمڕۆ</option>
        <option value="week">١ هەفتە</option>
        <option value="forever">تا سڕینەوە</option>
      </select>
      <button class="btn primary" style="margin-top:12px" onclick="addMsg()">زیادکردن</button>
      <div id="m_msg"></div>
    </div>
    <div class="gtable" id="m_list" style="--gcols:2fr 1fr auto"></div>
  `;
  const list = document.getElementById('m_list');
  if(!msgs || !msgs.length){ list.innerHTML = '<div class="empty">هیچ ئاگادارکردنەوەیەک نیە</div>'; return; }
  list.innerHTML = `
    <div class="ghead"><span>دەق</span><span>ماوە</span><span>کردار</span></div>
    <div class="gbody">
      ${msgs.map(m=>`
        <div class="grow">
          <div class="gcell t">${esc(m.body)}</div>
          <div class="gcell"><span class="gtag">${m.expires_at ? 'بەسەردەچێت: '+esc(m.expires_at) : 'هەتاهەتایی'}</span></div>
          <div class="gacts"><button class="btn sm danger" onclick="delRow('messages',${m.id})">سڕینەوە</button></div>
        </div>
      `).join('')}
    </div>
  `;
}
async function addMsg(){
  const body = document.getElementById('m_body').value.trim();
  if(!body){ document.getElementById('m_msg').innerHTML='<div class="msg err">دەق پێویستە</div>'; return; }
  const dur = document.getElementById('m_dur').value;
  let expires_at = null;
  const now = new Date();
  if(dur==='today'){ const d=new Date(now); d.setHours(23,59,59,999); expires_at = d.toISOString(); }
  else if(dur==='week'){ const d=new Date(now); d.setDate(d.getDate()+7); expires_at = d.toISOString(); }
  const { error } = await sb.from('messages').insert({ body, expires_at });
  if(error){ document.getElementById('m_msg').innerHTML = '<div class="msg err">هەڵە: '+esc(error.message)+'</div>'; return; }
  renderTicker();
}

/* ---------- INIT ---------- */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await checkAdmin(); }
})();
